[build]
command = "pnpm run build"
publish = ".next"

[build.environment]
NODE_VERSION = "22"
NEXT_TELEMETRY_DISABLED = "1"

# Upload-triggered builds need an explicit adapter declaration.
[[plugins]]
package = "@netlify/plugin-nextjs"

# Configure HIKMAH_BACKEND_URL and HIKMAH_BACKEND_TOKEN in Netlify's
# environment settings. Keep the token marked secret and production-only.
# Approved Free-plan secret scopes: builds, functions, runtime (not post_processing).
# Never put secrets here.
