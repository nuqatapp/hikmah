[build]
command = "pnpm run build"
publish = ".next"

[build.environment]
NODE_VERSION = "22"
NEXT_TELEMETRY_DISABLED = "1"

# Netlify automatically supplies its Next.js adapter.
# Configure HIKMAH_BACKEND_URL and HIKMAH_BACKEND_TOKEN in Netlify's
# environment settings, with Functions scope. Never put secrets here.
